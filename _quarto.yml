project:
  type: website
  output-dir: _site
  resources:
    - "images/*"

website:
  title: "Aaron Heit"
  description: "Middle school science teacher in Minnesota. Education data, assessment, and science instruction."
  favicon: favicon.svg
  site-url: "https://aaronheit.github.io"
  image: images/heit-headshot.jpg
  open-graph: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/aaron-heit-4038123b/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/aaronheit
        aria-label: GitHub
      - icon: bar-chart-fill
        href: https://public.tableau.com/app/profile/aaron.heit
        aria-label: Tableau Public
  page-footer:
    left: |
      Independent work. Not affiliated with or endorsed by the Minnesota
      Department of Education or the Anoka-Hennepin School District. All data
      work uses publicly available aggregate files and contains no student-level records.
    right: "Updated November 2026"

format:
  html:
    theme: [default, custom.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    link-external-newwindow: true
    link-external-icon: false
    email-obfuscation: references

execute:
  enabled: false
